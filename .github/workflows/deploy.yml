name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Never deploy a broken build: the site is only published if the whole suite
# passes first (see `needs: test` below).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # The integration tests exercise real SQL, so they need a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fantasy_coach
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fantasy_coach
      # Ingestion must never reach the network from CI.
      INGEST_NETWORK_ENABLED: '0'

    steps:
      - uses: actions/checkout@v5

      # No version pinned here on purpose: package.json's `packageManager`
      # field is the single source of truth, and specifying both makes
      # pnpm/action-setup fail with a version conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # Order matters: both invoke `next build` against the same `.next`
      # directory, so the static export runs first and the server build last,
      # leaving `.next` in the state `pnpm start` expects.
      - name: Build static export
        run: pnpm build:static

      - name: Build server bundle
        run: pnpm build

      - name: Browser tests (server build and static export)
        run: pnpm exec playwright test --config=playwright.ci.config.ts

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build static site
    needs: test
    runs-on: ubuntu-latest

    # configure-pages needs these to turn Pages on for the repo the first time,
    # so the site does not require a manual settings change to go live.
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      # No version pinned here on purpose: package.json's `packageManager`
      # field is the single source of truth, and specifying both makes
      # pnpm/action-setup fail with a version conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        # Derives the base path from the repo name, so a rename or a fork does
        # not silently produce a site with broken asset URLs.
        run: pnpm build:static
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      # Always publish the built site as a plain downloadable artifact, whether
      # or not Pages is available. Without this, a repository-level Pages
      # setting would leave you with no way to get at a build that succeeded.
      - name: Upload site as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-coach-site
          path: ./out
          retention-days: 30

      # Tries to turn Pages on. This fails with "Resource not accessible by
      # integration" when Pages is unavailable for the repository — most often
      # because it is PRIVATE, and Pages on a private repo needs GitHub Pro or
      # higher. That is a repository setting, not a build problem, so it must
      # not fail the run and leave main permanently red.
      - id: pages
        name: Configure GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain how to finish enabling Pages
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning title=GitHub Pages is not enabled::The site built \
          successfully but could not be published. Enable it under \
          Settings → Pages → Source: GitHub Actions. Pages on a PRIVATE \
          repository requires GitHub Pro or higher; on the free plan, make the \
          repository public first. The built site is attached to this run as \
          the 'fantasy-coach-site' artifact in the meantime."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: ./out

    outputs:
      pages_enabled: ${{ steps.pages.outcome }}

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests are tested and built, but only main is published — and only
    # when Pages is actually available for this repository.
    if: |
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.build.outputs.pages_enabled == 'success'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
