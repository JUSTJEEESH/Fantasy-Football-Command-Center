name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The deployment is static, so "fresh news" means "rebuilt recently".
  # Every three hours keeps the feed current without running a server.
  schedule:
    - cron: '0 */3 * * *'
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Never deploy a broken build: the site is only published if the whole suite
# passes first (see `needs: test` below).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # The integration tests exercise real SQL, so they need a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fantasy_coach
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fantasy_coach
      # Ingestion must never reach the network from CI.
      INGEST_NETWORK_ENABLED: '0'

    steps:
      - uses: actions/checkout@v5

      # No version pinned here on purpose: package.json's `packageManager`
      # field is the single source of truth, and specifying both makes
      # pnpm/action-setup fail with a version conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # Order matters: both invoke `next build` against the same `.next`
      # directory, so the static export runs first and the server build last,
      # leaving `.next` in the state `pnpm start` expects.
      # Fixture data so the browser tests exercise a populated feed without
      # depending on live sources being up.
      - name: Build fixture data pack
        run: pnpm build:data --fixtures
        env:
          ALLOW_EMPTY_DATA: '1'

      - name: Build static export
        run: pnpm build:static

      - name: Build server bundle
        run: pnpm build

      - name: Browser tests (server build and static export)
        run: pnpm exec playwright test --config=playwright.ci.config.ts

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build static site
    needs: test
    runs-on: ubuntu-latest

    permissions:
      # `write` so the gh-pages fallback below can push the built site.
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      # No version pinned here on purpose: package.json's `packageManager`
      # field is the single source of truth, and specifying both makes
      # pnpm/action-setup fail with a version conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fetches real players and real news. The runner has network access, which
      # is what lets a static deployment ship populated. Fails the job if every
      # source is unreachable rather than quietly publishing an empty site.
      - name: Fetch live data
        run: pnpm build:data
        env:
          INGEST_NETWORK_ENABLED: '1'

      - name: Build static export
        # Derives the base path from the repo name, so a rename or a fork does
        # not silently produce a site with broken asset URLs.
        run: pnpm build:static
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      # Always publish the built site as a plain downloadable artifact, whether
      # or not Pages is available. Without this, a repository-level Pages
      # setting would leave you with no way to get at a build that succeeded.
      - name: Upload site as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-coach-site
          path: ./out
          retention-days: 30

      # The site is published by pushing to the gh-pages branch, which is what
      # this repository's Pages source is set to.
      #
      # There used to be a second `deploy-pages` job here for the "GitHub
      # Actions" Pages source. It cannot work while the source is a branch, and
      # it failed during environment setup — before any step ran, so a
      # step-level `continue-on-error` never applied. The result was a red X on
      # every single run of a workflow that had in fact deployed successfully,
      # which is worse than useless: it trains you to ignore the one signal that
      # is supposed to tell you the deploy broke. One publishing route, honestly
      # reported.
      - name: Publish to gh-pages branch
        run: |
          cd out
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
          echo "Pushed $(find . -type f | wc -l) files to gh-pages."

